name: Playwright Automation Tests

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run tests against"
        required: true
        default: "qa"
        type: choice
        options:
          - qa

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest

    steps:

      # --------------------------------
      # 1. Checkout Repository
      # --------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------
      # 2. Setup Python
      # --------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # --------------------------------
      # 3. Install Dependencies
      # --------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------
      # 4. Install Playwright Browsers
      # --------------------------------
      - name: Install Playwright browsers
        run: |
          playwright install --with-deps chromium

      # --------------------------------
      # 5. Run Tests
      # --------------------------------
      - name: Run Playwright tests
        run: |
          pytest --env=${{ github.event.inputs.environment || 'qa' }} -n 2 -v \
            --alluredir=reports/allure-results

      # --------------------------------
      # 6. Upload Allure Results
      # --------------------------------
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: reports/allure-results

      # --------------------------------
      # 7. Upload HTML Report
      # --------------------------------
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: reports/html

      # --------------------------------
      # 8. Upload Logs
      # --------------------------------
      - name: Upload automation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-logs
          path: reports/logs

      # --------------------------------
      # 9. Upload Screenshots
      # --------------------------------
      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: reports/screenshots

      # --------------------------------
      # 10. Upload Playwright Traces
      # --------------------------------
      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: reports/traces

